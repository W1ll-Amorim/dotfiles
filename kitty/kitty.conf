# BEGIN_KITTY_FONTS
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 11.5

modify_font cell_height 110%
modify_font baseline 1
# END_KITTY_FONTS

# Tema
include ~/.config/kitty/themes/kanagawa.conf

# Transparência
background_opacity 0.85

# Cursor
cursor_shape block

# Mouse
mouse_map right press ungrabbed paste_from_clipboard

allow_remote_control yes
copy_on_select yes

# Scroll
scrollback_lines 10000

# Tamanho da janela ao iniciar
remember_window_size no
initial_window_width 135c
initial_window_height 35c
placement_strategy center

# Decorações da janela (Wayland)
# No Kitty 0.50 + Wayland, yes oculta a barra de título de forma consistente
# Se estiver no GNOME e quiser que a cor da barra de título siga o sistema, adicione a linha abaixo
hide_window_decorations yes
# wayland_titlebar_color system

# Padding e bordas
window_padding_width 8
window_border_width 0.5pt
draw_minimal_borders yes

# Integração Wayland
linux_display_server wayland

# Performance e comportamento
enable_audio_bell no
repaint_delay 10
input_delay 3
sync_to_monitor yes
mouse_hide_wait 0

# Shell
shell zsh

# Atalhos para o Neovim (sempre no diretório atual)
map ctrl+shift+n launch --cwd=current nvim
map ctrl+shift+e launch --cwd=current nvim
map ctrl+shift+v launch --type=overlay --cwd=current nvim

